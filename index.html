<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08050f;
    --grid-line: rgba(0, 255, 214, 0.07);
    --cyan: #00fff2;
    --magenta: #ff2ee6;
    --yellow: #f6ff2e;
    --card-bg: rgba(15, 10, 30, 0.75);
    --card-border: #2a1a4a;
    --text-primary: #e8f9ff;
    --text-secondary: #8b8fb8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(ellipse at 50% -10%, rgba(255, 46, 230, 0.25), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(0, 255, 242, 0.18), transparent 60%);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
    font-family: 'Share Tech Mono', monospace;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .container {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #0d0818;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 30px rgba(0,255,242,0.5), inset 0 0 15px rgba(0,255,242,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 34px;
    font-weight: 800;
    color: var(--cyan);
    margin-bottom: 18px;
    overflow: hidden;
    text-shadow: 0 0 8px var(--cyan);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 0 0 6px;
    color: var(--text-primary);
    text-shadow: 0 0 6px var(--magenta), 0 0 18px rgba(255,46,230,0.6);
  }
  .bio {
    font-size: 13px;
    color: var(--cyan);
    text-align: center;
    letter-spacing: 1px;
    margin: 0 0 32px;
    text-shadow: 0 0 6px rgba(0,255,242,0.5);
  }
  .bio::before, .bio::after { content: "// "; opacity: 0.6; }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    background: var(--card-bg);
    backdrop-filter: blur(4px);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    text-decoration: none;
    color: var(--text-primary);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .link-card:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,255,242,0.45);
    transform: translateY(-2px);
  }
  .link-card:nth-child(even):hover {
    border-color: var(--magenta);
    box-shadow: 0 0 14px rgba(255,46,230,0.45);
  }
  .link-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--cyan);
    filter: drop-shadow(0 0 4px rgba(0,255,242,0.6));
  }
  .link-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .link-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .link-sub {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  footer {
    margin-top: 36px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-secondary);
  }
  footer span { color: var(--magenta); }
</style>
</head>
