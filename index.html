<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapidR3D — Links</title>
<meta name="description" content="Links zu Forum, Projekten und GitHub Repos von RapidR3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --grid-line: rgba(0, 255, 214, 0.07);
    --cyan: #00fff2;
    --red: #ff2038;
    --yellow: #f6ff2e;
    --card-bg: rgba(10, 10, 10, 0.75);
    --card-border: rgba(255, 32, 56, 0.4);
    --text-primary: #e8f9ff;
    --text-secondary: #8b8fb8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .container {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: min(100%, 300px);
    height: auto;
    margin-bottom: 12px;
  }
  .bio {
    font-size: 13px;
    color: var(--cyan);
    text-align: center;
    letter-spacing: 1px;
    margin: 0 0 32px;
    text-shadow: 0 0 6px rgba(0,255,242,0.5);
  }
  .bio::before, .bio::after { content: "// "; opacity: 0.6; }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    background: var(--card-bg);
    backdrop-filter: blur(4px);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    text-decoration: none;
    color: var(--text-primary);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .link-card:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,255,242,0.45);
    transform: translateY(-2px);
  }
  .link-card:nth-child(even):hover {
    border-color: var(--red);
    box-shadow: 0 0 14px rgba(255,32,56,0.45);
  }
  .link-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--cyan);
    filter: drop-shadow(0 0 4px rgba(0,255,242,0.6));
  }
  .link-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .link-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .link-sub {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  footer {
    margin-top: 36px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-secondary);
  }
  footer span { color: var(--red); }
  .support-label {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--yellow);
    text-shadow: 0 0 6px rgba(246,255,46,0.5);
  }
  .donate-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    margin-top: 14px;
    padding: 20px 22px;
    background: linear-gradient(135deg, rgba(246,255,46,0.12), rgba(15,10,30,0.85));
    border: 2px solid var(--yellow);
    border-radius: 4px;
    text-decoration: none;
    color: var(--yellow);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    box-shadow: 0 0 16px rgba(246,255,46,0.5), inset 0 0 12px rgba(246,255,46,0.1);
    animation: donate-pulse 2.2s ease-in-out infinite;
    transition: transform 0.15s ease;
  }
  .donate-btn:hover {
    transform: translateY(-2px);
  }
  .donate-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 5px rgba(246,255,46,0.7));
  }
  .donate-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .donate-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(246,255,46,0.7);
  }
  .donate-sub {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  @keyframes donate-pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(246,255,46,0.5), inset 0 0 12px rgba(246,255,46,0.1); }
    50% { box-shadow: 0 0 28px rgba(246,255,46,0.85), inset 0 0 16px rgba(246,255,46,0.2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .donate-btn { animation: none; }
  }
</style>
</head>
